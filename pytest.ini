# Configuration de pytest : options appliquées automatiquement à chaque exécution.
# - testpaths / pythonpath : où chercher les tests et racine des imports (config, pages...)
# - addopts : captures d'écran, vidéos et traces conservées seulement en cas d'échec,
#   rapports HTML (reports/report.html) et JUnit (reports/junit.xml)
# - markers : liste des tags autorisés (--strict-markers refuse un tag inconnu ou mal orthographié)

[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
markers =
    smoke: tests critiques et rapides (lancés sur chaque PR)
    regression: suite de régression complète
    api: tests d'API sans navigateur
